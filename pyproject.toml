[project]
name = "hybrid-tracking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tracy", email = "tracy_sun@outlook.com" }
]
requires-python = ">=3.13"
dependencies = ["numpy>=1.26", "opencv-contrib-python>=4.8,<5"]

[project.scripts]
hybrid-tracking = "hybrid_tracking:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["hybrid_tracking", "toolbox"]
